services:
  webserver:
    build:
      context: ../backend
      dockerfile: webserver/Dockerfile
    # Branded image/container name per Ravi (2026-09-14). The service key
    # ("webserver") stays as-is on purpose — that's what Docker's internal
    # DNS resolves, and nginx.conf / seed.mjs both reference it by that
    # name; container_name is just an alias on top, doesn't change that.
    image: hashedtokens-edms-backend:v1.0
    container_name: hashedtokens-edms-backend
    ports:
      - "3000:3000"
    volumes:
      - ../backend/webserver/data:/app/data
      # REQUIRED: create an empty folder outside the checkout, then set source.
      # Reuse this anchor for the optional offline demo initializer below.
      - &edms-storage
        type: bind
        source: /REPLACE_WITH_YOUR_EDMS_DATA_PATH
        target: /app/edms_root
        bind:
          create_host_path: false
    environment:
      - RUST_LOG=info
      - EDMS_DB_PATH=/app/data/edms.db
      - EDMS_ROOT=/app/edms_root
    networks:
      - hashedtokens-edms

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: hashedtokens-edms-frontend:v1.0
    container_name: hashedtokens-edms-frontend
    ports:
      - "3911:80"  # per the folder-schema doc — open localhost:3911 for the UI
    depends_on:
      - webserver
    networks:
      - hashedtokens-edms

  # Explicit offline initialization; run once before starting the webserver.
  seed:
    profiles: [demo]
    build:
      context: ../backend
      dockerfile: webserver/Dockerfile
    image: hashedtokens-edms-backend:v1.0
    volumes:
      - ../backend/webserver/data:/app/data
      - *edms-storage
    command: ["./synthetic-data", "/app/edms_root", "/app/data/edms.db"]
    network_mode: none
    restart: "no"

networks:
  hashedtokens-edms:
    name: hashedtokens-edms
    driver: bridge
